generic:
  label: "social impression"
  skill: "persuasion"
  base_dc: 13
  modifiers:
    - when: "attitude.focus < 0"
      delta: 2
    - when: "attitude.focus > 0"
      delta: -2
    - when: "scene_heat >= 2"
      delta: 2
secrets:
  - id: "groll_storage_password"
    label: "persuade Groll for the password"
    holder: "groll"
    check: "persuade_groll"
    skill: "persuasion"
    base_dc: 12
    bind_any:
      - "password"
      - "secret word"
      - "the word"
      - "back room"
      - "hidden door"
      - "wall seam"
      - "cellar"
      - "locked"
      - "persuade"
      - "convince"
      - "talk into"
    modifiers:
      - when: "checks_failed.groll_storage_password >= 1"
        delta: 2
      - when: "checks_failed.groll_storage_password >= 2"
        delta: 2
    locks:
      - when: "player.has_password"
        message: "He already gave you what you needed."
      - when: "actor.groll.sworn_silent"
        message: "He swore silence — his lips won't move on that."
  - id: "sally_charm"
    label: "charm Sally"
    holder: "sally"
    check: "charm_sally"
    skill: "persuasion"
    base_dc: 14
    bind_any:
      - "charm"
      - "flirt"
      - "beautiful"
      - "pretty"
      - "handsome"
      - "lovely"
      - "date"
      - "kiss"
      - "your eyes"
    modifiers:
      - when: "player.sally_tip_discount"
        delta: -4
    locks:
      - when: "player.sally_charmed"
        message: "She already favors you — she laughs and squeezes your arm."
  - id: "dewr_intimidate"
    label: "challenge Dewr"
    holder: "dewr"
    check: "challenge_dewr"
    skill: "intimidation"
    base_dc: 10
    bind_any:
      - "intimidate"
      - "threaten"
      - "step aside"
      - "move aside"
      - "or else"
      - "back down"
      - "creep out"
    modifiers:
      - when: "attitude.dewr < 0"
        delta: -2
      - when: "player.dewr_backed_down"
        delta: -4
    locks:
      - when: "player.dewr_backed_down"
        message: "He already backed down. He glares from a safer distance."
  - id: "dewr_scam_callout"
    label: "see through Dewr's scam"
    holder: "dewr"
    check: "call_out_scam"
    skill: "insight"
    base_dc: 12
    bind_any:
      - "not pay"
      - "won't pay"
      - "wont pay"
      - "don't pay"
      - "refuse"
      - "scam"
      - "bluff"
      - "call out"
      - "fake tax"
      - "no toll"
    locks:
      - when: "player.dewr_scam_cleared"
        message: "There's no toll game left to call out."
      - when: "!dewr.alive"
        message: "There's no toll game left to call out."
  - id: "dremis_impress"
    label: "impress Dremis"
    holder: "dremis"
    check: "impress_dremis"
    skill: "persuasion"
    base_dc: 16
    bind_any:
      - "impress"
      - "worthy"
      - "prove myself"
      - "prove i"
      - "earn"
      - "amulet"
    locks:
      - when: "player.has_amulet"
        message: "You already carry what you came for."
      - when: "!player.aura_cleared"
        message: "The dread locks your tongue. You can barely stand."
